# Publishing to PyPI.
#
# A release is triggered by a `vX.Y.Z` tag and cannot happen without green
# tests, because publication is the one operation here that cannot be undone:
# a version number on PyPI must never be reused, even after the file is
# deleted. So the build and the tests are their own job, and publishing
# depends on them.
#
# Authentication is Trusted Publishing (OIDC) — no token in secrets. One-time
# setup on PyPI: Project → Publishing → Add a new publisher
#   owner: shipiit, repo: shipit-watchtower, workflow: release.yml
# Until that is enabled, the PYPI_API_TOKEN variant works instead — see the
# commented block at the end.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but do not publish"
        type: boolean
        default: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,all]"
      - run: ruff check shipit_watcher
      - run: pytest shipit_watcher/tests -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # `twine check` catches a broken README before it reaches the package
      # page — the one thing that cannot be corrected without a new release.
      - run: twine check dist/*
      # The tag has to match the version in pyproject. A mismatch means
      # releasing under a number nobody intended to release.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != version $PKG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

      # Fallback, if Trusted Publishing is not enabled yet:
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
