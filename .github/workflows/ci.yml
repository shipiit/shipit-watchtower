# Testy na każdy PR i push do main.
#
# Osobno od release.yml, bo pełni inną rolę: tu chodzi o szybkie sprzężenie
# zwrotne przy zmianie, tam o bramkę przed nieodwracalną publikacją.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,all]"
      - run: ruff check shipit_watcher
      - run: pytest shipit_watcher/tests -q --cov=shipit_watcher --cov-report=term-missing

  # Pakiet musi dać się zbudować przy każdej zmianie, nie dopiero przy tagu —
  # zepsuta metadana wykryta w dniu wydania blokuje wydanie.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
